name: FS0 Conformance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FS0_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.FS0_CANDIDATE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.14.7"

      - name: Verify candidate Governance binding
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B repo/governance/accepted_state.py --verify-action-binding

      - name: Run canonical FS0 Conformance
        run: ./repo/scripts/validate --verbose
